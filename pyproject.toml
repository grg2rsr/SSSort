[project]
name = "SSSort"
version = "0.1.0"
description = "spike sorter for single sensillum recordings"
authors = [
    {name = "Georg Raiser", email = "grg2rsr@gmail.com"},
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "neo",
    "quantities",
    "elephant",
    "scikit-learn",
    "tqdm",
    "seaborn",
    "dill",

]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
sssort = "sssort.run:main_cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.ruff.format]
quote-style = "single"